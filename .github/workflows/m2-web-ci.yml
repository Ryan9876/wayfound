name: M2 web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/m2-web-ci.yml'
      - 'docs/PRODUCT_REQUIREMENTS.md'
      - 'docs/DELIVERY_PLAN.md'
      - 'docs/M2_REQUIREMENTS.md'
      - 'docs/adr/0008-m2-postgres-access.md'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Domain tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wayfound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wayfound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wayfound
      WAYFOUND_DATA_ENV: development
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply M2 migration
        run: npm run migrate
      - name: PostgreSQL integration tests
        run: npm run test:integration
