name: M2 web CI

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/m2-web-ci.yml'
      - 'docs/PRODUCT_REQUIREMENTS.md'
      - 'docs/DELIVERY_PLAN.md'
      - 'docs/M2_REQUIREMENTS.md'
      - 'docs/adr/0008-m2-postgres-access.md'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Domain tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wayfound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wayfound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wayfound
      WAYFOUND_DATA_ENV: development
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply M2 migration
        run: npm run migrate
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Verify schema is present
        env:
          EXPECT_WAYFOUND_SCHEMA: present
        run: npm run test:schema
      - name: Backup synthetic M2 data
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres
          -v "${{ github.workspace }}/web:/backup"
          postgres:17
          pg_dump -h 127.0.0.1 -U postgres -d wayfound -Fc -f /backup/m2-ci.dump
      - name: Restore synthetic M2 backup
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:17 createdb -h 127.0.0.1 -U postgres wayfound_restore
          docker run --rm --network host -e PGPASSWORD=postgres -v "${{ github.workspace }}/web:/backup" postgres:17 pg_restore -h 127.0.0.1 -U postgres -d wayfound_restore /backup/m2-ci.dump
      - name: Verify restored project data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wayfound_restore
        run: npm run test:restore
      - name: Roll back M2 schema
        run: npm run rollback
      - name: Verify rollback removed M2 schema
        env:
          EXPECT_WAYFOUND_SCHEMA: absent
        run: npm run test:schema
      - name: Reapply M2 migration
        run: npm run migrate
      - name: Verify schema after reapply
        env:
          EXPECT_WAYFOUND_SCHEMA: present
        run: npm run test:schema
