name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check prototype structure
        run: npm run test:prototype

      - name: Check accessibility baseline
        run: npm run test:accessibility

      - name: Check TypeScript
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Install visual test tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built application
        run: |
          npm run start > /tmp/wayfound-next.log 2>&1 &
          echo $! > /tmp/wayfound-next.pid
          npx --yes wait-on@8.0.1 http://127.0.0.1:3000

      - name: Check keyboard navigation
        run: node scripts/validate-keyboard.mjs

      - name: Capture UI screenshots
        run: |
          mkdir -p artifacts/ui-screenshots
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1200 http://127.0.0.1:3000 artifacts/ui-screenshots/overview-mobile-first.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000 artifacts/ui-screenshots/overview-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/journey artifacts/ui-screenshots/journey-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/work artifacts/ui-screenshots/work-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/more artifacts/ui-screenshots/more-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/handoffs artifacts/ui-screenshots/handoffs-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/records artifacts/ui-screenshots/records-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/release-care artifacts/ui-screenshots/release-care-mobile-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000 artifacts/ui-screenshots/overview-desktop-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/journey artifacts/ui-screenshots/journey-desktop-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/work artifacts/ui-screenshots/work-desktop-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/handoffs artifacts/ui-screenshots/handoffs-desktop-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/records artifacts/ui-screenshots/records-desktop-full.png
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page --wait-for-timeout=1200 http://127.0.0.1:3000/release-care artifacts/ui-screenshots/release-care-desktop-full.png

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/ui-screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Stop built application
        if: always()
        run: |
          if [ -f /tmp/wayfound-next.pid ]; then
            kill "$(cat /tmp/wayfound-next.pid)" || true
          fi

  durable-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Start isolated Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Build application
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check database security
        run: npx supabase db advisors --local --type security --fail-on error
      - name: Validate durable workspace
        run: npm run test:workspace
      - name: Validate durable evidence
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:evidence
      - name: Validate durable artifacts
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:artifacts
      - name: Validate artifact acceptance
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:artifact-acceptance
      - name: Validate specialist review
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:specialist-review
      - name: Validate owner work lifecycle
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:work-lifecycle
      - name: Validate technical decision authority
        run: |
          WAYFOUND_LOCAL_TEST=1 node scripts/wait-for-local-backend.mjs
          npm run test:technical-decisions
      - name: Upload workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-screenshots
          path: artifacts/workspace
          if-no-files-found: warn
          retention-days: 7
      - name: Stop isolated Supabase
        if: always()
        run: npx supabase stop
