name: Finalize M2.1 validation

on:
  push:
    branches:
      - feature/m2.1-durable-interview
    paths:
      - '.github/scripts/finalize_m2_1.py'
      - '.github/workflows/finalize-m2-1.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2.1-durable-interview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile M2.1 validation state
        run: python .github/scripts/finalize_m2_1.py
      - name: Commit validation reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT_REQUIREMENTS.md docs/DELIVERY_PLAN.md docs/M2_1_VALIDATION.md
          git commit -m 'Mark M2.1 durable Interview validated'
          git push origin HEAD:feature/m2.1-durable-interview
