name: M2 docs reconcile

on:
  push:
    branches:
      - feature/m2-durable-project-slice

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[docs-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-durable-project-slice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile authoritative M2 docs
        run: node scripts/reconcile-m2-docs.mjs
      - name: Commit reconciliation when needed
        run: |
          if git diff --quiet -- docs/PRODUCT_REQUIREMENTS.md docs/DELIVERY_PLAN.md; then
            echo "Authoritative docs already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_REQUIREMENTS.md docs/DELIVERY_PLAN.md
          git commit -m "[docs-reconciled] Reconcile M2 requirements and delivery plan"
          git push origin HEAD:feature/m2-durable-project-slice
