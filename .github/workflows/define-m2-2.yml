name: Define M2.2 requirements

on:
  push:
    branches:
      - feature/m2.2-durable-records
    paths:
      - '.github/scripts/define_m2_2.py'
      - '.github/workflows/define-m2-2.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2.2-durable-records
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Define M2.2 requirements and milestone
        run: python .github/scripts/define_m2_2.py
      - name: Commit M2.2 authority update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT_REQUIREMENTS.md docs/DELIVERY_PLAN.md
          git commit -m 'Define M2.2 durable Records requirements'
          git push origin HEAD:feature/m2.2-durable-records
