name: Copy validated Interview model

on:
  push:
    branches:
      - feature/m2.1-durable-interview
    paths:
      - '.github/scripts/copy_validated_interview_model.py'
      - '.github/workflows/copy-validated-interview-model.yml'

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2.1-durable-interview
      - name: Copy validated model verbatim
        run: python .github/scripts/copy_validated_interview_model.py
      - name: Commit copied model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/shared/interview-model.js
          git commit -m 'Copy validated Interview model into durable app'
          git push origin HEAD:feature/m2.1-durable-interview
