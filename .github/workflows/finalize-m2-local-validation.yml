name: Finalize M2 local validation

on:
  push:
    branches:
      - feature/m2-durable-project-slice
    paths:
      - '.github/scripts/finalize_m2_local_validation.py'
      - '.github/workflows/finalize-m2-local-validation.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-durable-project-slice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile validated M2 authority
        run: python .github/scripts/finalize_m2_local_validation.py
      - name: Commit validation reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT_REQUIREMENTS.md docs/DELIVERY_PLAN.md
          git commit -m 'Mark M2 local-first slice validated'
          git push origin HEAD:feature/m2-durable-project-slice
