name: Harden M2.1 Interview back behavior

on:
  push:
    branches:
      - feature/m2.1-durable-interview
    paths:
      - '.github/scripts/harden_m2_1_back.py'
      - '.github/workflows/harden-m2-1-back.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2.1-durable-interview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harden first-question Back behavior
        run: python .github/scripts/harden_m2_1_back.py
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/app/projects/'[projectId]'/durable-interview.tsx web/tests/e2e/local-project.spec.ts
          git commit -m 'Harden M2.1 Interview back behavior'
          git push origin HEAD:feature/m2.1-durable-interview
