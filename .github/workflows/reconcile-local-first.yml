name: Reconcile local-first requirements

on:
  push:
    branches:
      - feature/m2-durable-project-slice

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m2-durable-project-slice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconcile requirements
        run: python .github/scripts/reconcile_local_first_requirements.py
      - name: Commit reconciled authority
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT_REQUIREMENTS.md
          git commit -m 'Reconcile M2 requirements to local-first runtime'
          git push origin HEAD:feature/m2-durable-project-slice
